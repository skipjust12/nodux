# How often to poll the Docker/Podman socket.
poll_interval_seconds: 15

# Don't repeat an alert from the same detector for the same container
# (by name) within this many minutes. 0 disables the cooldown.
alert_cooldown_minutes: 10

docker:
  # Docker Desktop / plain Docker on Linux:
  socket_path: /var/run/docker.sock
  # Podman (rootless, example for Linux):
  # socket_path: /run/user/1000/podman/podman.sock

# Container names that are never checked.
exclude_containers: []
  # - some-noisy-container

detectors:
  # Polled: restart count grows too fast.
  crashloop:
    enabled: true
    # Fire when a container has restarted restart_threshold times
    # within the last window_minutes.
    restart_threshold: 3
    window_minutes: 5

  # Polled: the container's HEALTHCHECK reports "unhealthy".
  unhealthy:
    enabled: true

  # Event-driven: the kernel OOM killer hit the container's memory limit.
  oom:
    enabled: true

  # Event-driven: the main process exited with a non-zero code on its
  # own. Stops/kills issued through docker (stop, kill, restart, rm -f,
  # compose down) are never reported.
  exit:
    enabled: true
    ignore_exit_codes: [0]

  # Polled: memory usage (minus reclaimable page cache, same as
  # docker stats) stays at or above threshold_percent of the container's
  # memory limit for for_seconds. The early warning before "oom".
  # Only containers started with a memory limit (-m / mem_limit) are
  # checked; adds one stats API call per such container per poll.
  memory:
    enabled: true
    threshold_percent: 90
    for_seconds: 60

# Where alerts go. Console (JSON lines on stdout) is always on.
actions:
  webhook:
    enabled: false
    # $VAR / ${VAR} are expanded from the environment, in url and headers.
    url: https://hooks.slack.com/services/${NODUX_SLACK_PATH}
    # json: POST the full alert record (same as the console line).
    # slack: POST {"text": ...}; also works for Mattermost, Rocket.Chat,
    # and Discord (append /slack to the Discord webhook URL).
    format: slack
    timeout_seconds: 5
    headers: {}
      # Authorization: Bearer ${NODUX_WEBHOOK_TOKEN}

# Stub for the optional future LLM layer (does nothing yet).
llm:
  enabled: false
