# How often to poll the Docker/Podman socket.
poll_interval_seconds: 15

docker:
  # Docker Desktop / plain Docker on Linux:
  socket_path: /var/run/docker.sock
  # Podman (rootless, example for Linux):
  # socket_path: /run/user/1000/podman/podman.sock

# Container names that are never checked.
exclude_containers: []
  # - some-noisy-container

detectors:
  crashloop:
    enabled: true
    # Fire when a container has restarted restart_threshold times
    # within the last window_minutes.
    restart_threshold: 3
    window_minutes: 5

# Stub for the optional future LLM layer (does nothing yet).
llm:
  enabled: false
