# nodux configuration. Every setting has a default: an empty file gives
# you every detector and host check on, alerts on stdout only. This file
# spells the defaults out; delete what you don't change. Unknown keys
# are an error, so a typo can't silently fall back to a default.

# Stamped on every alert. Empty = the machine's hostname (inside a
# container, pass --hostname or set this).
hostname: ""

# debug, info, warn or error.
log_level: info

# How often to poll the Docker/Podman socket and check the host.
poll_interval_seconds: 15

# One-off alerts (exit, oom) from the same detector for the same
# container name are not repeated within this many minutes, so a crash
# loop gives you one exit alert, not one per restart. 0 disables it.
# Other detectors alert once per episode and send a "resolved" when it's
# over, so they don't need a cooldown.
alert_cooldown_minutes: 10

# Where nodux keeps what has to survive a restart: open alerts, detector
# state and the event stream position (state.json), and the alert
# history (history.db, SQLite). With it, a restart doesn't re-send what's
# still broken, resolves what got fixed meanwhile, and replays the
# Docker events it missed. The digest and the LLM layer's "earlier
# alerts" read the history. Must be writable; "" keeps everything in
# memory (and turns the digest off).
state_dir: /var/lib/nodux

history:
  # Alerts and LLM usage older than this are deleted. Memory samples
  # (for the digest) are kept two weeks at most.
  retention_days: 30

docker:
  # Docker on Linux:
  socket_path: /var/run/docker.sock
  # Podman (rootless, example for Linux):
  # socket_path: /run/user/1000/podman/podman.sock

  # Alert when the daemon has been unreachable this long. 0 disables it.
  down_alert_after_seconds: 60

# Container names that are never checked (the LLM layer can't see them
# either).
exclude_containers: []
  # - some-noisy-container

# Containers can also be tuned with labels, e.g. in a compose file:
#
#   nodux.enable=false             never check this container
#   nodux.expected=true            it must be running (see expected below)
#   nodux.<detector>.enable=false  turn one detector off for it
#                                  (crashloop, unhealthy, oom, exit, memory)
#   nodux.memory.threshold=80      percent of its memory limit
#   nodux.memory.for=2m            ...for this long
#   nodux.crashloop.threshold=5    restarts...
#   nodux.crashloop.window=10m     ...within this window
#   nodux.exit.ignore=0,143        exit codes that aren't a crash

detectors:
  # A container was restarted after a crash restart_threshold times
  # within window_minutes (manual restarts don't count). Resolved once it
  # has been running for a whole window without a restart.
  crashloop:
    enabled: true
    restart_threshold: 3
    window_minutes: 5

  # The container's HEALTHCHECK reports "unhealthy" (running containers
  # only). Resolved when it's healthy again.
  unhealthy:
    enabled: true

  # The kernel OOM killer hit the container's memory limit.
  oom:
    enabled: true

  # The main process exited with a non-zero code on its own. Stops and
  # kills issued through docker (stop, kill, restart, rm -f, compose
  # down) are never reported; docker kill -s HUP and friends don't count
  # as a stop.
  exit:
    enabled: true
    ignore_exit_codes: [0]

  # Memory usage (minus reclaimable page cache, same as docker stats)
  # stays at or above threshold_percent of the container's memory limit
  # for for_seconds. The early warning before "oom". Only containers
  # started with a memory limit (-m / mem_limit) are checked; adds one
  # stats API call per such container per poll.
  memory:
    enabled: true
    threshold_percent: 90
    for_seconds: 60

  # A container with a CPU limit (--cpus, cpus: in compose) was
  # throttled in at least threshold_percent of its CFS scheduling periods
  # for for_seconds: it needs more CPU than it's allowed, the classic
  # "slow but not crashing". Shares the stats call with "memory".
  cpu_throttle:
    enabled: true
    threshold_percent: 25
    for_seconds: 300

  # These containers must be running. Catches what nothing else does: a
  # container that exited with code 0, or wasn't started after a reboot.
  # A container has to be down for grace_seconds before it's reported,
  # so a compose recreate doesn't trigger it. Containers labeled
  # nodux.expected=true count too, for as long as they exist; the ones
  # listed here must also exist.
  expected:
    enabled: true
    containers: []
      # - postgres
      # - api
    grace_seconds: 60

# Host checks. They keep running while the Docker daemon is down.
host:
  # Where the host's /proc is. In a container, /proc/stat, /proc/meminfo,
  # /proc/vmstat and /proc/pressure already describe the host.
  proc_path: /proc

  # Filesystem at or above threshold_percent full, by space or inodes.
  # In a container, mount the host's filesystems (e.g. -v /:/host:ro)
  # and list them here (/host).
  disk:
    enabled: true
    paths: [/]
    threshold_percent: 90
    # Predict when each path fills up from how fast it has been filling
    # over the last window_minutes; alert when that's under
    # horizon_hours away ("/ will be full in ~6h"). Needs a quarter of
    # the window of samples before it says anything.
    forecast:
      enabled: true
      window_minutes: 60
      horizon_hours: 12

  # Host memory in use (MemTotal - MemAvailable).
  memory:
    enabled: true
    threshold_percent: 90
    for_seconds: 300

  # CPU busy time (steal counts as busy, iowait doesn't).
  cpu:
    enabled: true
    threshold_percent: 95
    for_seconds: 600

  # Pressure stall information (/proc/pressure, Linux 4.20+): the share
  # of the last minute (avg60) that tasks spent stalled waiting for a
  # resource. "some" = at least one task, "full" = all non-idle tasks at
  # once. memory some catches thrashing before the OOM killer runs; io
  # full catches a dying disk or a noisy neighbour on shared storage.
  # 0 turns a signal off.
  pressure:
    enabled: true
    memory_some_percent: 10
    memory_full_percent: 0
    io_some_percent: 0
    io_full_percent: 10
    cpu_some_percent: 0
    for_seconds: 60

  # The kernel OOM killer killed something that isn't in a container
  # (the oom_kill counter in /proc/vmstat moved, and no container OOM
  # event accounts for it): host RAM ran out, or a systemd unit hit its
  # MemoryMax. Container OOMs are the "oom" detector's.
  oom:
    enabled: true

# Check that services answer, from nodux's point of view. For a
# container without a HEALTHCHECK this is the only way to know the
# service works. https and tls probes also watch certificate expiry.
probes:
  interval_seconds: 30
  timeout_seconds: 5
  # Checks in a row that must fail before alerting.
  failures: 2
  # Certificate expiry: a warning this many days out, critical this many
  # days out (the episode escalates). 0 disables expiry alerts.
  cert_warn_days: 14
  cert_critical_days: 3
  targets: []
    # - name: api
    #   url: http://127.0.0.1:8080/healthz   # GET; redirects aren't followed
    #   status: [200]                        # default: any 2xx/3xx
    #   container: api                       # attach this container's logs
    # - name: site
    #   url: https://example.com/            # also tracks the certificate
    # - name: postgres
    #   tcp: 127.0.0.1:5432                  # connect only
    # - name: mail
    #   tls: mail.example.com:465            # handshake + certificate
    #   # tls_skip_verify: true              # self-signed; expiry still checked

# Related alerts go out as one message per incident instead of one
# each: alerts about the same container or the same compose project,
# and anything that fails while a host-level alert (disk, memory, CPU,
# the Docker daemon) is open. With the LLM layer on, an incident gets
# one analysis. Silenced alerts never join an incident.
incidents:
  enabled: true
  # Alerts are held this long to collect related ones. 0 sends right
  # away (later alerts of the incident go out as updates).
  group_wait_seconds: 30
  # An incident takes new alerts while its last one is this recent.
  window_minutes: 10

# Alert messages and logs are scrubbed before they go to a webhook or
# the LLM. defaults covers password=..., bearer tokens, credentials in
# URLs and common key formats (AWS, GitHub, Slack, sk-...).
redact:
  defaults: true
  # Extra regular expressions. A group named "secret" masks only that
  # group: 'session=(?P<secret>\w+)' -> 'session=[REDACTED]'.
  patterns: []

# Where alerts go. Console (JSON lines on stdout) is always on.
actions:
  # Receivers, each with its own routing: severities ([warning],
  # [critical], or empty for both), detectors (globs, empty = all),
  # send_resolved (default true) and digest (the periodic digest,
  # default true). An incident's alerts are filtered per receiver, so a
  # critical-only receiver gets just the critical part of a batch.
  # $VAR / ${VAR} are expanded from the environment in urls, tokens,
  # chat_id and headers.
  receivers: []
    # - name: oncall
    #   type: telegram
    #   bot_token: ${NODUX_TELEGRAM_TOKEN}  # can be the chatops bot
    #   chat_id: "-1001234567890"     # or @channelname
    #   # thread_id: 42               # a forum topic
    #   severities: [critical]
    # - name: phone
    #   type: ntfy
    #   url: https://ntfy.sh/${NODUX_NTFY_TOPIC}
    #   # token: ${NODUX_NTFY_TOKEN}  # protected topics
    #   severities: [critical]
    #   digest: false
    # - name: team
    #   type: webhook
    #   url: https://hooks.slack.com/services/${NODUX_SLACK_PATH}
    #   format: slack                 # or json (the full alert record)
    #   severities: [warning]

  # A single webhook that gets every alert (the pre-receivers way to
  # configure one; it still works).
  webhook:
    enabled: false
    # $VAR / ${VAR} are expanded from the environment in url and
    # headers; a variable that's unset or empty is a startup error.
    url: https://hooks.slack.com/services/${NODUX_SLACK_PATH}
    # json: POST the full alert record (same as the console line).
    # slack: POST {"text": ...}; also works for Mattermost, Rocket.Chat,
    # and Discord (append /slack to the Discord webhook URL).
    format: slack
    timeout_seconds: 5
    headers: {}
      # Authorization: Bearer ${NODUX_WEBHOOK_TOKEN}

silences:
  # Deploys mute alerts by themselves: create, stop and remove events for
  # a container (compose up, docker run, docker stop, docker rm) silence
  # it and the rest of its compose project until this long after the
  # last one. An alert still open when the window closes goes out then.
  # Crashes and OOM kills are never held back by a deploy window. 0
  # disables it. Manual silences: nodux silence api 30m. With state_dir,
  # silences and windows survive a restart.
  deploy_grace_seconds: 120

server:
  # Control socket for nodux status and nodux silence. Empty disables
  # it; if it can't be created, nodux runs without it.
  socket_path: /run/nodux/nodux.sock
  # TCP address for /metrics (Prometheus) and /healthz, e.g.
  # 127.0.0.1:9321. Empty disables it. The silence API is never served
  # here.
  listen: ""

# A dead man's switch: GET this URL every interval_seconds while nodux
# can reach the Docker daemon. Point it at healthchecks.io, an Uptime
# Kuma push monitor, etc.; if nodux dies, or loses the daemon, the pings
# stop and that service alerts you.
heartbeat:
  enabled: false
  url: https://hc-ping.com/${NODUX_HEARTBEAT_UUID}
  interval_seconds: 60

# Optional: have Claude read each incident (alerts, redacted logs, how
# long the container ran, its image and whether it just changed, its
# earlier alerts) and add a short probable-cause note. It can look
# further with read-only tools (container details, logs around the
# failure, live stats and processes, docker system df, a host overview,
# alert history); it can't change anything. Also answers the chat bot
# and writes the digest's takeaway. Detection doesn't depend on it.
llm:
  enabled: false
  api_key: ${ANTHROPIC_API_KEY}
  model: claude-opus-5-5
  # low, medium, high, xhigh or max.
  effort: low
  # Rounds of tool calls per analysis; 0 = no tools, one request.
  max_steps: 4
  # For a whole analysis, tool calls included.
  timeout_seconds: 90
  # Analyses, answers and digest notes per hour; alerts over the cap go
  # out without an analysis. 0 = no cap.
  max_per_hour: 30

# A periodic report through the same actions: what broke and how often,
# what flaps, what's still open, whose memory keeps growing, and what
# the LLM layer cost. Needs state_dir. Preview it any time with
# nodux --config ... -digest.
digest:
  enabled: false
  # daily or weekly.
  every: daily
  # Local time of the host (set TZ in a container).
  at: "09:00"
  # For weekly.
  weekday: monday

# Ask about the host from Telegram: "what's wrong with api?" is answered
# by the LLM layer with the same read-only tools; /status and /alerts
# work without it. The bot polls Telegram, so nothing listens on the
# host. It only answers the chats listed here: write to it once and the
# log tells you your chat ID.
chatops:
  telegram:
    enabled: false
    token: ${NODUX_TELEGRAM_TOKEN}
    allowed_chat_ids: []
      # - 123456789
